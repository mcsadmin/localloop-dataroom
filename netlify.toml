# Local Loop Merseyside — Data Room
# Netlify configuration
# Deploy from: github.com/mcsadmin/localloop-dataroom
# Live at: dataroom.localloop-merseyside.co.uk

[build]
  publish = "public"

# Edge function checks auth cookie on all protected routes
[[edge_functions]]
  path = "/*"
  excludedPath = [
    "/login",
    "/login.html",
    "/logout",
    "/logout.html",
    "/do-login",
    "/favicon.ico",
    "/.netlify/*",
    "/assets/*",
    "/financial-model/assets/*"
  ]
  function = "auth-gate"

# Route login form POST to the serverless function
[[redirects]]
  from = "/do-login"
  to = "/.netlify/functions/login"
  status = 200
  force = true

# Serve login.html at /login (clean URL)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Serve logout.html at /logout
[[redirects]]
  from = "/logout"
  to = "/logout.html"
  status = 200

# SPA fallback for the financial model (React router handles /about/* etc.)
[[redirects]]
  from = "/financial-model/*"
  to = "/financial-model/index.html"
  status = 200

# Root index fallback
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
