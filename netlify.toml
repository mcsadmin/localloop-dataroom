# Local Loop Merseyside — Data Room
# Netlify configuration
# Deploy from: github.com/mcsadmin/localloop-dataroom
# Live at: dataroom.localloop-merseyside.co.uk

[build]
  publish = "public"

# Edge function guards every route except login, logout, and static assets
[[edge_functions]]
  path = "/*"
  excludedPath = ["/login", "/login.html", "/logout", "/logout.html", "/favicon.ico", "/assets/*", "/financial-model/assets/*"]
  function = "auth-gate"

# Serve login.html at /login (clean URL)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Serve logout.html at /logout
[[redirects]]
  from = "/logout"
  to = "/logout.html"
  status = 200

# SPA fallback for the financial model (React router handles /about/* etc.)
[[redirects]]
  from = "/financial-model/*"
  to = "/financial-model/index.html"
  status = 200

# Root index fallback
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
