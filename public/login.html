<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Loop Merseyside — Data Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #1a3a2a;
      --forest-mid: #2d5a3d;
      --sage: #7aab8a;
      --cream: #f7f4ef;
      --text: #1c2b22;
      --muted: #6b7c72;
      --border: #d4ddd7;
      --error: #c0392b;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(26,58,42,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--forest);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .logo-text {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--forest);
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--forest);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--cream);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--forest-mid);
      box-shadow: 0 0 0 3px rgba(45,90,61,0.12);
    }

    .error-msg {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--error);
      display: none;
    }

    .error-msg.visible { display: block; }

    button[type="submit"] {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--forest);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover { background: var(--forest-mid); }
    button[type="submit"]:active { transform: scale(0.98); }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">Local Loop Merseyside</div>
        <div class="logo-sub">Data Room</div>
      </div>
    </div>

    <h1>Access required</h1>
    <p class="subtitle">This data room is private. Please enter the access passphrase to continue.</p>

    <form method="POST" action="/do-login">
      <input type="hidden" name="next" id="next-field" value="/" />
      <label for="password">Passphrase</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter passphrase"
        autocomplete="current-password"
        autofocus
        required
      />
      <div class="error-msg" id="error-msg">Incorrect passphrase — please try again.</div>
      <button type="submit">Enter data room</button>
    </form>
  </div>

  <p class="footer">For access, contact the Local Loop Merseyside team.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next) document.getElementById('next-field').value = next;
    if (params.get('error') === '1') {
      document.getElementById('error-msg').classList.add('visible');
    }
  </script>
</body>
</html>
