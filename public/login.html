<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Loop Merseyside — Data Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      oklch(0.30 0.155 293);
      --purple-mid:  oklch(0.38 0.145 293);
      --green:       oklch(0.90 0.195 130);
      --cream:       #f5f4f8;
      --text:        #1c1a2e;
      --muted:       #6b6880;
      --border:      #dddae8;
      --error:       #c0392b;
    }

    html, body {
      height: 100%;
      font-family: 'Open Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(30, 0, 80, 0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .logo-img {
      height: 40px;
      width: auto;
    }

    .logo-sub {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    h1 {
      font-family: 'Arvo', Georgia, serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--cream);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--purple-mid);
      box-shadow: 0 0 0 3px oklch(0.30 0.155 293 / 0.12);
    }

    .error-msg {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--error);
      display: none;
    }

    .error-msg.visible { display: block; }

    button[type="submit"] {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover { background: var(--purple-mid); }
    button[type="submit"]:active { transform: scale(0.98); }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img
        src="https://manus.space/manus-storage/logo-purple-transparent_e17b0e88.png"
        alt="Local Loop Merseyside"
        class="logo-img"
      />
    </div>

    <h1>Access required</h1>
    <p class="subtitle">This data room is private. Please enter the access passphrase to continue.</p>

    <form method="POST" action="/do-login">
      <input type="hidden" name="next" id="next-field" value="/" />
      <label for="password">Passphrase</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter passphrase"
        autocomplete="current-password"
        autofocus
        required
      />
      <div class="error-msg" id="error-msg">Incorrect passphrase — please try again.</div>
      <button type="submit">Enter data room</button>
    </form>
  </div>

  <p class="footer">For access, contact the Local Loop Merseyside team.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next) document.getElementById('next-field').value = next;
    if (params.get('error') === '1') {
      document.getElementById('error-msg').classList.add('visible');
    }
  </script>
</body>
</html>
